[project]
name = "mynotes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ajay SR", email = "ajay1kumar1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[project.scripts]
mynotes = "mynotes:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
